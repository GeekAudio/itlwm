<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="IntelWirelessNative 项目的本轮实测、40 项验收与下一步计划。">
  <!-- site-version -->
  <!-- site-freshness -->
  <title>IntelWirelessNative · 开发进度</title>
  <link rel="stylesheet" href="./assets/site.css">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="#overview" aria-label="IntelWirelessNative 首页">
        <span class="brand-mark" aria-hidden="true">IW</span>
        <span class="brand-name">IntelWirelessNative</span>
      </a>
      <nav class="top-nav" aria-label="页面导航">
        <a href="#acceptance-matrix">本轮验收</a>
        <a href="#next-step">下一步</a>
        <a class="repo-link" href="https://github.com/GeekAudio/itlwm" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </header>

    <main>
      <section class="hero" id="overview" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span>开发现场 <span class="eyebrow-divider" aria-hidden="true">/</span> Intel AX201 原生驱动</p>
          <h1 id="page-title">从稳定连接，到原生 AirDrop。</h1>
          <p class="hero-description">记录每轮实机结果、当前卡点和下一步验证。离线检查与设备实测分开呈现。</p>
          <p class="hero-summary" id="current-summary">正在读取当前运行版本与实测摘要…</p>
        </div>
        <aside class="version-panel" id="version-panel" aria-label="候选版本状态"></aside>
      </section>

      <section class="focus-area" id="focus-area" aria-label="当前进展重点"></section>

      <section class="section-card acceptance-section" id="acceptance-matrix" aria-labelledby="acceptance-title">
        <div id="progress-overview" class="progress-overview" aria-live="polite"></div>
        <div id="matrix-content"></div>
      </section>

      <section class="section-card next-section" id="next-step" aria-labelledby="next-title">
        <div class="section-heading">
          <div>
            <p class="section-eyebrow">WHAT COMES NEXT</p>
            <h2 id="next-title">下一步</h2>
            <p class="section-description">沿着依赖顺序推进，每一步都以可复核的实测证据收口。</p>
          </div>
        </div>
        <div id="next-content"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-meta">数据更新 <time id="updated-at">读取中</time></div>
      <div class="freshness-control">
        <span id="site-freshness" role="status" aria-live="polite">正在检查最新版本</span>
        <button id="site-refresh-retry" type="button" hidden>重新检查</button>
      </div>
      <a href="https://github.com/GeekAudio/itlwm" target="_blank" rel="noopener noreferrer">查看源码 <span aria-hidden="true">↗</span></a>
    </footer>
  </div>



</body>
</html>
