  <meta name="iw-site-version" content="0d2e2f05f15550085aba9f56600b1f520123501effd3871cc924b1db0f8feaa9">
  <script>
/* Check the live manifest on each visit, including back/forward restoration. */
(function () {
  "use strict";

  function installFreshness(win) {
    const doc = win.document;
    const loaded = doc.querySelector('meta[name="iw-site-version"]')?.content;
    let active = null;
    let state = { text: "正在检查更新", tone: "checking", retry: false };

    function paint() {
      const label = doc.getElementById("site-freshness");
      const button = doc.getElementById("site-refresh-retry");
      if (label) {
        label.textContent = state.text;
        label.dataset.state = state.tone;
      }
      if (button) {
        button.hidden = !state.retry;
        button.onclick = () => checkLatest(true);
      }
    }

    function status(text, tone, retry = false) {
      state = { text, tone, retry };
      paint();
    }

    function nonce() {
      return win.crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`;
    }

    async function checkLatest(manual = false) {
      if (!/^https?:$/.test(win.location.protocol)) {
        status("离线文件，未检查线上更新", "offline");
        return;
      }
      if (active) return;
      const controller = new win.AbortController();
      active = controller;
      const timer = win.setTimeout(() => controller.abort(), 8000);
      status("正在检查更新", "checking");
      try {
        const manifestURL = new URL("./site-version.json", win.location.href);
        manifestURL.searchParams.set("check", nonce());
        const response = await win.fetch(manifestURL.href, {
          cache: "no-store", credentials: "omit", signal: controller.signal
        });
        if (!response.ok) throw new Error("manifest unavailable");
        const manifest = await response.json();
        if (active !== controller) return;
        if (manifest.schema !== 1 || !/^[a-f0-9]{64}$/.test(manifest.version)) {
          throw new Error("invalid manifest");
        }
        if (loaded === manifest.version) {
          status("已核对最新发布", "current");
          return;
        }
        const target = new URL(win.location.href);
        // If the edge served old HTML even for the requested revision, stop
        // instead of creating an automatic reload loop during publication.
        if (!manual && target.searchParams.get("v") === manifest.version &&
            target.searchParams.has("fresh")) {
          status("新版正在同步，当前显示旧版", "pending", true);
          return;
        }
        target.searchParams.set("v", manifest.version);
        target.searchParams.set("fresh", nonce());
        status("发现新版，正在更新", "updating");
        win.location.replace(target.href); // Preserves the current chapter hash.
      } catch (_) {
        if (active === controller) {
          status("未能检查更新，当前版本可能已过期", "unverified", true);
        }
      } finally {
        win.clearTimeout(timer);
        if (active === controller) active = null;
      }
    }

    doc.addEventListener("DOMContentLoaded", paint);
    win.addEventListener("pageshow", () => checkLatest());
    win.addEventListener("online", () => checkLatest());
    win.addEventListener("pagehide", () => {
      const previous = active;
      active = null;
      previous?.abort();
    });
    doc.addEventListener("visibilitychange", () => {
      if (doc.visibilityState === "visible") checkLatest();
    });
    paint();
    return { checkLatest };
  }

  if (typeof module !== "undefined" && module.exports) {
    module.exports = { installFreshness };
  } else {
    installFreshness(window);
  }
})();

</script>

  <style>
:root {
  color-scheme: light;
  --page: #f5f7f8;
  --surface: #fff;
  --surface-soft: #f7fafb;
  --surface-blue: #edf5fa;
  --ink: #172b3a;
  --muted: #5a6c79;
  --faint: #81909a;
  --line: #dce5ea;
  --line-strong: #c9d6de;
  --blue: #236b91;
  --blue-deep: #164d6c;
  --blue-soft: #e8f3f8;
  --teal: #13827f;
  --teal-soft: #e3f4f1;
  --amber: #956015;
  --amber-soft: #fbf2df;
  --red: #a54138;
  --red-soft: #f9e9e6;
  --radius: 16px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--page);
  color: var(--ink);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

* { box-sizing: border-box; }
html { min-width: 320px; scroll-behavior: smooth; scroll-padding-top: 18px; }
body { min-width: 320px; margin: 0; background: var(--page); color: var(--ink); }
body, button { font-family: inherit; }
button { color: inherit; }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--blue); }
a:focus-visible, button:focus-visible, summary:focus-visible {
  outline: 3px solid #65a9c7;
  outline-offset: 3px;
}
button:disabled { cursor: default; }
.site-shell { width: min(100% - 48px, 1180px); margin: 0 auto; }

.site-header {
  display: flex;
  min-width: 0;
  min-height: 68px;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border-bottom: 1px solid var(--line);
}
.brand { display: inline-flex; min-width: 0; align-items: center; gap: 10px; }
.brand-mark {
  display: grid;
  width: 31px;
  height: 31px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 9px;
  background: var(--blue-deep);
  color: white;
  font-size: 10px;
  font-weight: 760;
  letter-spacing: .04em;
}
.brand-name { overflow-wrap: anywhere; font-size: 13px; font-weight: 700; letter-spacing: -.015em; }
.top-nav { display: flex; min-width: 0; align-items: center; justify-content: flex-end; gap: 6px; }
.top-nav a {
  display: inline-flex;
  min-height: 34px;
  align-items: center;
  gap: 5px;
  padding: 7px 10px;
  border-radius: 8px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 580;
  white-space: nowrap;
}
.top-nav a:hover { background: var(--surface); color: var(--blue-deep); }
.top-nav .repo-link { color: var(--blue-deep); }

.hero {
  display: grid;
  min-width: 0;
  grid-template-columns: minmax(0, 1.35fr) minmax(280px, .65fr);
  align-items: center;
  gap: clamp(24px, 5vw, 64px);
  padding: clamp(34px, 5.3vw, 66px) 0 35px;
}
.hero-copy { min-width: 0; }
.eyebrow, .section-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin: 0;
  color: var(--teal);
  font-size: 11px;
  font-weight: 720;
  letter-spacing: .095em;
}
.eyebrow-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 4px var(--teal-soft); }
.eyebrow-divider { color: var(--line-strong); }
.hero h1 {
  max-width: 720px;
  margin: 14px 0 10px;
  color: var(--ink);
  font-size: clamp(29px, 4.2vw, 47px);
  font-weight: 690;
  letter-spacing: -.05em;
  line-height: 1.22;
  overflow-wrap: anywhere;
}
.hero-description { max-width: 620px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.75; }
.hero-summary {
  max-width: 700px;
  margin: 19px 0 0;
  padding: 11px 14px;
  border-left: 3px solid var(--teal);
  border-radius: 0 9px 9px 0;
  background: #eaf4f3;
  color: #285956;
  font-size: 13px;
  line-height: 1.65;
  overflow-wrap: anywhere;
}

.version-panel { display: grid; min-width: 0; gap: 8px; }
.version-item {
  display: grid;
  min-width: 0;
  grid-template-columns: 1fr auto;
  align-items: start;
  gap: 4px 10px;
  padding: 13px 14px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--surface);
}
.version-item .label { grid-column: 1 / -1; color: var(--faint); font-size: 11px; font-weight: 680; letter-spacing: .07em; text-transform: uppercase; }
.version-item strong.version-code { min-width: 0; align-self: center; color: var(--ink); font-size: 14px; font-weight: 690; overflow-wrap: anywhere; }
.version-item p { grid-column: 1 / -1; margin: 2px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; overflow-wrap: anywhere; }
.pill {
  display: inline-flex;
  max-width: 100%;
  min-height: 22px;
  align-items: center;
  justify-content: center;
  padding: 4px 8px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: var(--blue-soft);
  color: var(--blue-deep);
  font-size: 11px;
  font-weight: 680;
  line-height: 1.35;
  text-align: center;
  overflow-wrap: anywhere;
}
.pill.neutral { border-color: var(--line); background: var(--surface-soft); color: var(--muted); }
.pill.success { background: var(--teal-soft); color: #12665f; }
.pill.warning { background: var(--amber-soft); color: #81520e; }

.focus-area { display: grid; min-width: 0; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0 0 35px; }
.focus-card {
  position: relative;
  min-width: 0;
  padding: 16px 17px 15px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
}
.focus-card.is-blocked { border-color: #ead9b7; background: #fffdf8; }
.card-index { display: inline-block; margin-bottom: 10px; color: var(--teal); font-size: 11px; font-weight: 750; letter-spacing: .1em; font-variant-numeric: tabular-nums; }
.focus-card > .pill { position: absolute; top: 13px; right: 13px; max-width: 52%; }
.focus-card h3 { max-width: 82%; margin: 0 0 6px; font-size: 13px; font-weight: 680; line-height: 1.45; }
.focus-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; }
.focus-card .card-next { display: inline-flex; margin-top: 10px; color: var(--blue); font-size: 12px; font-weight: 670; line-height: 1.5; }
.focus-card .card-next:hover { text-decoration: underline; text-underline-offset: 3px; }

.section-card { min-width: 0; margin: 0 0 22px; padding: clamp(18px, 3vw, 28px); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: 0 5px 20px rgb(26 52 69 / 3%); }
.progress-overview { min-width: 0; margin-bottom: 22px; }
.progress-overview:empty { display: none; }
.section-heading { display: flex; min-width: 0; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
.section-heading > div { min-width: 0; }
.section-heading h2 { margin: 5px 0 0; color: var(--ink); font-size: clamp(20px, 2.6vw, 26px); font-weight: 690; letter-spacing: -.035em; line-height: 1.3; overflow-wrap: anywhere; }
.section-description { max-width: 740px; margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
.count-total { display: inline-flex; flex: 0 0 auto; align-items: baseline; gap: 4px; color: var(--faint); font-size: 11px; font-weight: 650; white-space: nowrap; }
.count-total strong { color: var(--ink); font-size: clamp(24px, 3vw, 32px); font-weight: 730; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.progress-summary { display: flex; min-width: 0; flex-wrap: wrap; align-items: baseline; gap: 5px 9px; margin-bottom: 9px; }
.progress-summary > span { display: inline-flex; min-width: 0; align-items: baseline; gap: 5px; padding: 4px 8px; border-radius: 7px; background: var(--surface-soft); }
.progress-summary .count { color: var(--ink); font-size: clamp(23px, 3vw, 31px); font-weight: 720; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.progress-summary .label { color: var(--muted); font-size: 12px; line-height: 1.55; }
.progress-summary .passed .count { color: var(--teal); }
.progress-summary .partial .count { color: var(--amber); }
.progress-summary .regressed .count { color: var(--red); }
.progress-summary .not_covered .count { color: var(--faint); }
.progress-track { display: flex; width: 100%; height: 8px; overflow: hidden; border-radius: 99px; background: #e9eef1; }
.progress-fill, .partial-fill { display: block; height: 100%; min-width: 0; transition: width .3s ease; }
.progress-fill { background: var(--teal); }
.partial-fill { background: #d7a746; }
.scope-note { margin: 9px 0 0; color: var(--faint); font-size: 12px; line-height: 1.55; }

#matrix-content { min-width: 0; }
#matrix-content > .section-heading { align-items: flex-end; }
.matrix-scroll { width: 100%; max-width: 100%; overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-color: var(--line-strong) transparent; scrollbar-width: thin; }
.matrix-scroll-hint { display: none; }
.acceptance-matrix { width: 100%; min-width: 760px; table-layout: fixed; border-collapse: separate; border-spacing: 5px; margin: -5px; }
.acceptance-matrix caption { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
.acceptance-matrix th, .acceptance-matrix td { padding: 0; }
.acceptance-matrix thead th { padding: 4px 3px 7px; color: var(--faint); font-size: 11px; font-weight: 670; text-align: center; }
.acceptance-matrix thead th:first-child { width: 176px; }
.acceptance-matrix .matrix-row-head { width: 176px; text-align: left; vertical-align: middle; }
.stage-button {
  display: grid;
  width: 100%;
  min-height: 48px;
  align-content: center;
  justify-items: start;
  gap: 4px;
  padding: 7px 9px;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.stage-button:hover, .stage-button[aria-pressed="true"] { border-color: var(--line); background: var(--surface-soft); }
.stage-button small { color: var(--faint); font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stage-button span { min-width: 0; font-size: 12px; font-weight: 680; line-height: 1.4; overflow-wrap: anywhere; }
.matrix-cell {
  display: grid;
  width: 100%;
  min-height: 62px;
  grid-template-columns: auto 1fr;
  align-content: start;
  align-items: center;
  gap: 5px 7px;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface-soft);
  color: var(--ink);
  font: inherit;
  text-align: left;
  vertical-align: top;
  cursor: pointer;
}
.matrix-cell:hover { border-color: #9bbbc9; background: #f2f8fa; }
.matrix-cell[aria-pressed="true"] { outline: 2px solid var(--blue); outline-offset: 1px; }
.cell-index { color: var(--faint); font-size: 10px; font-weight: 730; font-variant-numeric: tabular-nums; }
.cell-name { min-width: 0; grid-column: 1 / -1; color: var(--ink); font-size: 12px; font-weight: 630; line-height: 1.4; overflow-wrap: anywhere; }
.cell-status { grid-column: 1 / -1; justify-self: start; color: var(--muted); font-size: 10px; font-weight: 650; line-height: 1.35; }
.matrix-cell[data-result="passed"] { border-color: #b7dcd4; background: #f2faf8; }
.matrix-cell[data-result="passed"] .cell-status { color: #146b61; }
.matrix-cell[data-result="partial"] { border-color: #ead9ad; background: #fffaf0; }
.matrix-cell[data-result="partial"] .cell-status { color: #85590f; }
.matrix-cell[data-result="regressed"] { border-color: #e8c5c0; background: #fff6f4; }
.matrix-cell[data-result="regressed"] .cell-status { color: var(--red); }
.matrix-cell[data-result="not_covered"] { color: var(--muted); }
.evidence-panel[hidden] { display: none; }
.evidence-panel { position: relative; margin: 18px 0 0; padding: 17px 90px 17px 18px; border: 1px solid #c6dce5; border-left: 3px solid var(--blue); border-radius: 11px; background: var(--surface-blue); }
.evidence-panel .detail-heading { display: flex; min-width: 0; align-items: flex-start; justify-content: space-between; gap: 14px; }
.evidence-panel h3 { margin: 0; color: var(--ink); font-size: 14px; font-weight: 700; line-height: 1.45; overflow-wrap: anywhere; }
.evidence-panel .close-detail { position: absolute; top: 12px; right: 12px; display: grid; width: auto; min-width: 64px; height: 30px; padding: 0 10px; place-items: center; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--muted); font-size: 11px; white-space: nowrap; cursor: pointer; }
.evidence-panel .detail-body { margin-top: 8px; }
.evidence-panel p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; }
.evidence-panel .detail-label { color: var(--blue-deep); font-size: 11px; font-weight: 700; }

.next-intro { display: flex; min-width: 0; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 15px; padding: 11px 13px; border-radius: 9px; background: var(--surface-blue); }
.next-intro h3 { flex: 0 1 auto; min-width: 0; margin: 0; color: var(--ink); font-size: 13px; font-weight: 700; line-height: 1.5; overflow-wrap: anywhere; }
.next-intro p { flex: 1 1 380px; min-width: 0; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
#next-content > .pill { flex: 0 0 auto; }
.next-list { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; counter-reset: next; }
.next-list li { display: grid; min-width: 0; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; padding: 13px 2px; border-top: 1px solid var(--line); }
.step-number { display: grid; width: 27px; height: 27px; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; background: var(--surface-soft); color: var(--blue-deep); font-size: 11px; font-weight: 720; font-variant-numeric: tabular-nums; }
.next-list li > div { min-width: 0; }
.next-list h4 { margin: 1px 0 4px; color: var(--ink); font-size: 13px; font-weight: 680; line-height: 1.45; overflow-wrap: anywhere; }
.next-list p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; }
.extra-evidence { margin-top: 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-soft); }
.extra-evidence summary { padding: 10px 12px; color: var(--muted); font-size: 12px; font-weight: 650; cursor: pointer; }

.site-footer { display: flex; min-width: 0; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin: 24px 0 0; padding: 16px 0 24px; border-top: 1px solid var(--line); color: var(--faint); font-size: 11px; }
.footer-meta { font-variant-numeric: tabular-nums; }
.freshness-control { display: flex; min-width: 0; flex-wrap: wrap; align-items: center; gap: 6px; }
#site-freshness[data-state="current"] { color: var(--teal); }
#site-freshness[data-state="unverified"], #site-freshness[data-state="pending"] { color: var(--amber); }
#site-refresh-retry { padding: 4px 7px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--blue-deep); font-size: 11px; cursor: pointer; }
#site-refresh-retry[hidden] { display: none; }
.site-footer > a { color: var(--blue); font-weight: 650; }
.muted { color: var(--muted); }
.text-link { color: var(--blue-deep); text-decoration: underline; text-underline-offset: 2px; }
.sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0,0,0,0) !important; white-space: nowrap !important; border: 0 !important; }

@media (max-width: 900px) {
  .matrix-scroll-hint { display: block; margin: 0 0 10px; color: var(--muted); font-size: 12px; }
  .site-shell { width: min(100% - 36px, 760px); }
  .hero { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-top: 38px; }
  .version-panel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .focus-area { grid-template-columns: 1fr; }
  .focus-card { padding-right: 150px; }
  .matrix-cell { min-height: 58px; padding: 8px; }
}
@media (max-width: 600px) {
  .site-shell { width: min(100% - 28px, 520px); }
  .site-header { min-height: 58px; align-items: flex-start; flex-direction: column; justify-content: center; gap: 8px; padding: 10px 0; }
  .brand-mark { width: 27px; height: 27px; }
  .brand-name { font-size: 12px; }
  .top-nav { width: 100%; justify-content: flex-start; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .top-nav::-webkit-scrollbar { display: none; }
  .top-nav a { min-height: 29px; flex: 0 0 auto; padding: 5px 8px; font-size: 12px; }
  .hero { gap: 16px; padding: 31px 0 23px; }
  .hero h1 { margin-top: 12px; font-size: clamp(27px, 8vw, 36px); }
  .hero-description { font-size: 13px; }
  .hero-summary { margin-top: 14px; padding: 9px 11px; font-size: 13px; }
  .version-panel { grid-template-columns: minmax(0, 1fr); }
  .focus-area { gap: 7px; margin-bottom: 22px; }
  .focus-card { padding: 13px 14px; }
  .focus-card > .pill { top: 10px; right: 10px; }
  .section-card { margin-bottom: 14px; padding: 15px 12px; border-radius: 13px; }
  .section-heading { align-items: flex-start; flex-direction: column; gap: 7px; margin-bottom: 13px; }
  .section-heading h2 { font-size: 20px; }
  .progress-overview { margin-bottom: 16px; }
  .progress-summary .count { font-size: 25px; }
  .acceptance-matrix { min-width: 760px; border-spacing: 4px; }
  .acceptance-matrix thead th:first-child,
  .acceptance-matrix .matrix-row-head { width: 176px; }
  .stage-button { min-height: 44px; gap: 5px; padding: 6px; }
  .matrix-cell { min-height: 54px; gap: 4px; padding: 6px; }
  .evidence-panel { padding: 14px 76px 14px 12px; }
  .next-list li { grid-template-columns: 28px minmax(0, 1fr); gap: 8px; }

    if (checkpoint) {
      const lineage = evidenceLineage.get(checkpoint.id);
      const classification = lineage?.kind === "derived" ? "同轮间接验证通过（原始状态仍未独立测试）" :
        lineage?.kind === "direct" ? "本轮直接记录 · " + labels[checkpoint.current_result] :
        "本轮没有可应用的直接或间接证据";
      body.append(node("span", "detail-label", "验证分类 · " + classification));
      if (lineage?.kind === "derived" && lineage.rule) {
        body.append(node("p", "lineage-proof", lineage.rule.proof));
        body.append(node("p", "lineage-scope", "适用范围：" + lineage.rule.scope));
      }
      appendLineageDetails(body, checkpoint, lineage);
    }
    if (!checkpoint) {
      body.append(node("span", "detail-label", "还需验证"), node("p", "", stage.pending));
    }
    detail.append(heading, body);
    detail.hidden = false;
    if (scroll) {
      detail.scrollIntoView({ block: "nearest" });
      detail.focus({ preventScroll: true });
    }
  }

  function renderAcceptance() {
    const overview = $("#progress-overview");
    const heading = node("div", "section-heading");
    const title = node("h2", "", `${validationRoundLabel} · 40 项验收`);
    title.id = "acceptance-title";
    heading.append(title);
    overview.replaceChildren(node("div", "section-eyebrow", "CURRENT TEST ROUND"), heading);

    const summary = node("div", "progress-summary");
    summary.classList.add("with-lineage");
    const summaryItems = [
      ["passed", "直接通过", visibleCounts.passed],
      ["derived", "间接验证通过", visibleCounts.derived],
      ["partial", "部分通过", visibleCounts.partial],
      ["regressed", "未通过", visibleCounts.regressed],
      ["not_covered", "无直接/间接证据", visibleCounts.not_covered]
    ];
    summaryItems.forEach(([key, label, value]) => {
      const stat = node("span", key);
      stat.append(node("strong", "count", String(value)), node("span", "label", label));
      summary.append(stat);
    });
    overview.append(summary, node("p", "scope-note",
      `这是 ${validationRoundLabel} 这一轮的 40 项固定检查，不是项目完成度：${counts.passed} 项直接通过、${counts.partial} 项部分通过、${counts.regressed} 项未通过；另有 ${lineageCounts.derived} 项由同轮源码必经路径间接验证通过，${visibleCounts.not_covered} 项本轮没有直接或间接证据。间接项保留原始点位状态，并展示对应源码、运行记录与适用边界。`));

    const evidenceStages = stages.filter(stage =>
      stage.checkpoints.some(point => evidenceLineage.get(point.id)?.kind !== "scope"));
    const highlights = node("section", "stage-highlights");
    highlights.setAttribute("aria-labelledby", "stage-evidence-heading");
    const highlightsHeader = node("div", "stage-highlights-heading");
    const headingCopy = node("div", "stage-highlights-copy");
    const evidenceHeading = node("h3", "", "本轮有直接或间接证据的阶段");
    evidenceHeading.id = "stage-evidence-heading";
    headingCopy.append(evidenceHeading, node("p", "", "通过结果会标明直接实测或由源码必经前置间接验证；其他检查仍保留在完整验收表中。"));
    highlightsHeader.append(headingCopy, node("span", "stage-highlights-count", `${evidenceStages.length} / ${stages.length} 个阶段`));
    highlights.append(highlightsHeader);
    const grid = node("div", "stage-evidence-grid");
    evidenceStages.forEach(stage => {
      const stageCounts = Object.fromEntries(Object.keys(labels).map(result =>
        [result, stage.checkpoints.filter(point => point.current_result === result).length]));
      const indirectCount = stage.checkpoints.filter(point => evidenceLineage.get(point.id)?.kind === "derived").length;
      const resultCount = stageCounts.passed + stageCounts.partial + stageCounts.regressed + indirectCount;
      const tone = stageCounts.regressed ? "warning" : stageCounts.partial ? "warning" : "success";
      const card = node("article", "stage-evidence-card");
      card.append(node("span", "stage-evidence-kicker", `阶段 ${String(stage.stage).padStart(2, "0")}`));
      card.append(node("h4", "", stageNames[stage.stage] || stage.name));
      const badges = node("div", "stage-evidence-status");
      [["passed", "success"], ["partial", "warning"], ["regressed", "warning"]].forEach(([key, badgeTone]) => {
        if (stageCounts[key]) badges.append(pill(`${stageCounts[key]} ${labels[key]}`, badgeTone));
      });
      if (indirectCount) badges.append(pill(`${indirectCount} 间接验证通过`, "success"));
      card.append(badges, node("p", "", stage.current_summary || stage.evidence || stage.name));
      card.append(node("span", "stage-evidence-count", `${resultCount} / 5 项有本轮证据`));
      card.append(link("查看本阶段依据 ↗", `#stage-${stage.stage}`, "stage-evidence-link"));
      card.dataset.tone = tone;
      grid.append(card);
    });
    if (!evidenceStages.length) {
      grid.append(node("p", "empty-evidence", "本轮尚未取得可计入的直接结果。完整检查项和既往证据仍保留在下方。"));
    }
    highlights.append(grid);
    const quietStages = stages.length - evidenceStages.length;
    if (quietStages > 0) {
      highlights.append(node("p", "not-tested-note", `另有 ${quietStages} 个阶段本轮没有新结果；它们不代表失败，可在完整表中逐项查看。`));
    }
    overview.append(highlights);

    matrixDetails = node("details", "acceptance-details");
    matrixDetails.id = "acceptance-details";
    const toggle = node("summary", "acceptance-toggle");
    const toggleCopy = node("span", "acceptance-toggle-copy");
    toggleCopy.append(node("strong", "", `展开全部 ${checkpoints.length} 项验收细节`),
      node("span", "", "查看逐项状态、技术证据与仍待验证内容"));
    toggle.append(toggleCopy, node("span", "acceptance-toggle-count", `${visibleCounts.not_covered} 项无直接/间接证据`));
    matrixDetails.append(toggle, node("p", "matrix-note",
      "原始 40 项状态不被重写。只有同一驱动、同一测试轮次中，源码明确要求的状态前置且后续结果实际通过时才标为间接验证；相关性、先后顺序、TX_RSP 或 active-monitor 能力不会自动等同 ACK。稳定性、大文件、睡眠与共存不从单包结果外推。"));

    const table = node("table", "acceptance-matrix");
    table.append(node("caption", "sr-only", `${validationRoundLabel} · 8 阶段、40 项固定验收`));
    const head = node("thead");
    const header = node("tr");
    ["验收阶段", "检查项 01", "检查项 02", "检查项 03", "检查项 04", "检查项 05"].forEach(text => {
      const th = node("th", "", text);
      th.scope = "col";
      header.append(th);
    });
    head.append(header);
    table.append(head);
    const body = node("tbody");
    stages.forEach(stage => {
      const row = node("tr");
      row.id = `stage-${stage.stage}`;
      const th = node("th", "matrix-row-head");
      th.scope = "row";
      const button = node("button", "stage-button");
      button.type = "button";
      button.setAttribute("aria-pressed", "false");
      button.setAttribute("aria-controls", "matrix-detail");
      button.append(node("span", "", `${String(stage.stage).padStart(2, "0")}  ${stageNames[stage.stage] || stage.name}`));
      const evidenceCount = stage.checkpoints.filter(point =>
        evidenceLineage.get(point.id)?.kind !== "scope").length;
      button.append(node("small", "", `${evidenceCount} / 5 有本轮结果 · 查看阶段`));
      button.addEventListener("click", () => showDetail(stage, null, button));
      th.append(button);
      row.append(th);
      stage.checkpoints.forEach(point => {
        const cell = node("td");
        const button = node("button", "matrix-cell");
        button.type = "button";
        button.id = `check-${point.id}`;
        const lineage = evidenceLineage.get(point.id);
        const visibleStatus = lineage?.kind === "derived" ? "间接验证通过" : labels[point.current_result];
        button.dataset.result = point.current_result;
        button.dataset.lineage = lineage?.kind || "scope";
        button.setAttribute("aria-pressed", "false");
        button.setAttribute("aria-controls", "matrix-detail");
        button.setAttribute("aria-label", `${point.id} ${point.name}：${visibleStatus}；原始点位状态：${labels[point.current_result]}`);
        button.append(node("span", "cell-index", lineage?.kind === "derived" ? "↳" : symbols[point.current_result]), node("span", "cell-name", shortNames[point.id] || point.name), node("span", "cell-status", visibleStatus));
        button.addEventListener("click", () => showDetail(stage, point, button));
        cell.append(button);
        row.append(cell);
      });
      body.append(row);
    });
    table.append(body);
    const scroll = node("div", "matrix-scroll");
    scroll.setAttribute("role", "region");
    scroll.setAttribute("aria-label", "验收表，小屏可左右滚动");
    scroll.tabIndex = 0;
    scroll.append(table);
    const detailsBody = node("div", "acceptance-details-body");
    detailsBody.append(node("p", "matrix-scroll-hint", "左右滑动查看全部检查项 →"), scroll, detail);
    matrixDetails.append(detailsBody);
    $("#matrix-content").replaceChildren(matrixDetails);
  }

  function renderRecent() {
    const section = node("section", "section-card recent-progress");
    section.id = "recent-progress";
    section.setAttribute("aria-labelledby", "recent-progress-title");
    const record = records[0] || null;
    const header = node("div", "recent-progress-heading");
    const copy = node("div");
    copy.append(node("p", "section-eyebrow", "LATEST TEST RECORD"));
    const title = node("h2", "", "最近实测进展");
    title.id = "recent-progress-title";
    copy.append(title, node("p", "section-description", record ? `${record.version} · ${record.date || "日期待确认"}` : `${running} · 本轮结果`));
    header.append(copy, pill(record?.tone === "success" ? "验证完成" : "仍有未闭环", record?.tone === "success" ? "success" : "neutral"));
    section.append(header);

    const lead = node("p", "recent-progress-lead", record?.short_summary || workflow?.headline || data.currentRuntimeLabel || "等待新的实测记录。");
    section.append(lead);

    const factSource = workflow?.facts || [];
    const preferredLabels = ["请求与返回", "接收交付", "首个未闭环步骤", "新完成记录", "下一版部署"];
    let featured = factSource.filter(fact => preferredLabels.includes(fact.label)).slice(0, 4);
    if (!featured.length && record?.evidence?.length) {
      const evidence = record.evidence;
      featured = evidence.slice(0, Math.min(3, evidence.length)).map((value, index) => ({ label: `本轮证据 ${index + 1}`, value }));
      if (evidence.length > 3) featured.push({ label: "尚未闭环", value: evidence[evidence.length - 1] });
    }
    const grid = node("div", "recent-facts-grid");
    featured.forEach(fact => {
      const card = node("article", "recent-fact-card");
      card.append(node("h3", "", fact.label), node("p", "", fact.value));
      grid.append(card);
    });
    if (featured.length) section.append(grid);

    const blockerTitle = workflow?.alert?.title || record?.blockers?.[0] || "";
    const blockerText = workflow?.alert?.detail || record?.blockers?.[0] || "";
    if (blockerTitle || blockerText) {
      const blocker = node("aside", "recent-blocker");
      blocker.append(pill("当前主要卡点", "warning"));
      if (blockerTitle) blocker.append(node("h3", "", blockerTitle));
      if (blockerText && blockerText !== blockerTitle) blocker.append(node("p", "", blockerText));
      section.append(blocker);
    }

    const details = node("details", "recent-record-details");
    const detailSummary = node("summary", "", "展开完整技术记录与边界");
    details.append(detailSummary);
    const body = node("div", "recent-record-body");
    if (record?.summary) body.append(node("p", "recent-record-summary", record.summary));
    const provenance = record?.provenance;
    if (provenance) {
      body.append(node("h3", "", "驱动与对端工具来源"));
      body.append(node("p", "recent-record-summary",
        `驱动：${provenance.driverCandidate} · source_commit ${provenance.driverSourceCommit} · Mach-O UUID ${provenance.driverUuid}`));
      body.append(node("p", "recent-record-summary",
        `对端工具：${provenance.toolRound} · source_commit ${provenance.toolSourceCommit}（本轮实机驱动与工具分别绑定上方记录的 Test129 来源）`));
      const links = node("div", "lineage-links");
      (provenance.sources || []).forEach(source => {
        const anchor = link(source.label + " ↗", source.url, "lineage-source-link");
        anchor.target = "_blank";
        anchor.rel = "noopener noreferrer";
        links.append(anchor);
      });
      if (links.childNodes.length) body.append(links);
    }
    const evidence = record?.evidence || factSource.map(fact => `${fact.label}：${fact.value}`);
    if (evidence.length) {
      body.append(node("h3", "", "本轮观测"));
      const list = node("ul", "recent-evidence-list");
      evidence.forEach(item => list.append(node("li", "", item)));
      body.append(list);
    }
    if (record?.blockers?.length) {
      body.append(node("h3", "", "仍待验证"));
      const list = node("ul", "recent-evidence-list");
      record.blockers.forEach(item => list.append(node("li", "", item)));
      body.append(list);
    }
    if (record?.next?.length) {
      body.append(node("h3", "", "记录中的下一步"));
      const list = node("ul", "recent-evidence-list");
      record.next.forEach(item => list.append(node("li", "", item)));
      body.append(list);
    }
    details.append(body);
    section.append(details);
    return section;
  }

  function renderNext() {
    const host = $("#next-content");
    const candidate = node("div", "next-candidate-card");
    const candidateVersion = data.nextCandidate ? next : running;
    candidate.append(pill(candidateVersion, "neutral"), node("strong", "", data.nextCandidateState || "当前状态待核实"));
    if (data.nextCandidateSummary) candidate.append(node("p", "", data.nextCandidateSummary));

    const alert = workflow?.alert;
    const blocker = node("aside", "next-blocker");
    blocker.append(pill("主要卡点", "warning"));
    blocker.append(node("h3", "", alert?.title || "当前待验证项"));
    blocker.append(node("p", "", alert?.detail || records[0]?.blockers?.[0] || "等待最新实测记录确认。"));

    const action = node("div", "next-action-card");
    action.append(node("span", "next-action-label", "下一步"));
    action.append(node("p", "", workflow?.nextAction || data.nextCandidateSummary || "等待下一轮验证计划。"));
    host.replaceChildren(candidate, blocker, action);
  }

  function navigateHash() {
    const hash = location.hash;
    const stageMatch = hash.match(/^#stage-(\d+)$/);
    const checkMatch = hash.match(/^#check-(\d+-\d+)$/);
    if (stageMatch || checkMatch) {
      const stage = stageById(Number(stageMatch?.[1] || checkMatch[1].split("-")[0]));
      if (!stage) return;
      const point = checkMatch && stage.checkpoints.find(item => item.id === checkMatch[1]);
      const trigger = point ? document.getElementById(`check-${point.id}`) : document.querySelector(`#stage-${stage.stage} .stage-button`);
      showDetail(stage, point || null, trigger);
    } else {
      const aliases = { "#milestones": "acceptance-matrix", "#principle-map": "focus-area", "#workflow-overview": "focus-area", "#development-timeline": "next-step", "#test-records": "next-step", "#acceptance": "next-step" };
      document.getElementById(aliases[hash])?.scrollIntoView({ block: "start" });
    }
  }
  installLineageStyles();
  renderBrief();
  const recentProgress = renderRecent();
  renderNext();
  renderAcceptance();
  const main = $("#overview").parentElement;
  main.append($("#overview"), recentProgress, $("#next-step"), $("#focus-area"), $("#acceptance-matrix"));
  window.addEventListener("hashchange", navigateHash);
  navigateHash();
})();

</script>
</body>
</html>
